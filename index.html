<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskZen ✿ Make productivity feel good</title>
  <meta name="description" content="TaskZen — your tasks, your habits, your little victories. Tasks, calendar, kanban, habits, focus timer, achievements and a Zen Garden that grows with you.">
  <meta name="theme-color" content="#7C5CFF">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('taskzen:v2') || '{}');
      var t = (s.settings && s.settings.theme) || 'system';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✿</span>
        <div><strong>TaskZen</strong><span>Make productivity feel good</span></div>
      </div>
      <nav>
        <p class="nav-heading">Main menu</p>
        <ul id="nav"></ul>
      </nav>
      <div class="sidebar-level" id="sidebar-level"></div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><i data-lucide="menu" class="ic"></i></button>
        <form class="topbar-add" id="topbar-add" autocomplete="off">
          <i data-lucide="sparkles" class="ic"></i>
          <input id="topbar-add-input" aria-label="Quick add a task" placeholder="Quick add: “Call John tomorrow at 10 #work !high”">
          <kbd>N</kbd>
        </form>
        <div class="topbar-right">
          <a href="#/focus" class="focus-pill" id="focus-pill" hidden></a>
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode"><i data-lucide="moon" class="ic"></i></button>
          <a href="#/settings" class="profile-btn" id="profile-btn" aria-label="Profile and settings"></a>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Task details"></aside>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:2rem;font-family:sans-serif">TaskZen needs JavaScript to run.</p></noscript>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
